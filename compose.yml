# docker compose up -d   ->  http://<this machine>:8787 (or, behind a prefix-routing
# proxy, the container's name as a subdomain: http://saveserv.<host>)
services:
  saveserv:
    build: .
    image: saveserv:latest
    container_name: saveserv
    restart: unless-stopped
    ports:
      # HTTP; leave it out when a reverse proxy reaches the container.
      - "8787:8787"
      # Discovery: answers devices looking for the server (the plugin's
      # "Find server", `saveserv discover`).
      - "8787:8787/udp"
    volumes:
      - ./data:/data
    environment:
      # "first": only the first account may self-register; add others from
      # the Account page. "open": anyone on the network may register.
      SAVESERV_REGISTER: first
      SAVESERV_KEEP: "50"
      # The address devices should use, announced to discovery. Set it in a
      # .env file next to this one; empty: devices use the address that answered.
      SAVESERV_URL: ${SAVESERV_URL:-}
