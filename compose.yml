# docker compose up -d   ->  http://saveserv.docker-host.lan (the container name is
# the subdomain of a prefix-routing proxy), or http://docker-host.lan:8787 directly
services:
  saveserv:
    build: .
    image: saveserv:latest
    container_name: saveserv
    restart: unless-stopped
    ports:
      # HTTP; leave it out when a reverse proxy reaches the container.
      - "8787:8787"
      # Discovery: answers devices looking for the server (the plugin's
      # "Find server", `saveserv discover`).
      - "8787:8787/udp"
    volumes:
      - ./data:/data
    environment:
      # "first": only the first account may self-register; add others from
      # the Account page. "open": anyone on the network may register.
      SAVESERV_REGISTER: first
      SAVESERV_KEEP: "50"
      # The address devices should use, announced to discovery.
      SAVESERV_URL: http://saveserv.docker-host.lan
